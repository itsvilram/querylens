[project]
name = "querylens-api"
version = "0.1.0"
description = "QueryLens backend: plain-English questions to safe, read-only SQL."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.142.1",
    "fastembed>=0.8.1",
    "httpx2>=2.13.1",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "sqlglot>=30.20.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.31.3",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, B bugbear, UP pyupgrade,
# SIM simplify, S bandit (security), ASYNC async pitfalls, RUF ruff-specific.
select = ["E", "W", "F", "I", "B", "UP", "SIM", "S", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # plain assert is how pytest works
# Scripts run fixed `docker compose` commands and open one fixed https:// URL, on purpose.
"scripts/**" = ["S310", "S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # so tests can `import app`
addopts = "--import-mode=importlib"  # test files in different folders may share a name
markers = [
    "integration: needs Postgres from docker compose (run `docker compose up -d db` first)",
]
