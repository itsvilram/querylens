[project]
name = "querylens-api"
version = "0.1.0"
description = "QueryLens backend: plain-English questions to safe, read-only SQL."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.142.1",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, B bugbear, UP pyupgrade,
# SIM simplify, S bandit (security), ASYNC async pitfalls, RUF ruff-specific.
select = ["E", "W", "F", "I", "B", "UP", "SIM", "S", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # plain assert is how pytest works

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # so tests can `import app`
addopts = "-q"
