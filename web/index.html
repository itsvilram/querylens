<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="QueryLens: ask a database questions in plain English.">
    <title>QueryLens</title>
    <script>
      // Apply the saved theme before the app loads, so a dark page doesn't flash light.
      // Same rule as src/stores/theme.ts.
      try {
        const choice = localStorage.getItem('querylens-theme')
        const dark =
          choice === 'dark' ||
          (choice !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      } catch {
        // storage blocked: the app applies the system theme when it starts
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
