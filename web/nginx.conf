server {
    listen 80;
    root /usr/share/nginx/html;

    # Single-page app: unknown paths get index.html and Vue decides what to show.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API calls go to the FastAPI container. Buffering is off, so server-sent
    # events (live progress) reach the browser immediately.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
